<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlterEgo™ AI | Sovereign Edge Intelligence Core</title>
    <style>
        body {
            background-color: #050505;
            color: #b3b3b3;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .ai-station {
            width: 100%;
            max-width: 600px;
            text-align: center;
            background: #0a0a0a;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #111;
            box-shadow: 0 30px 70px rgba(0,0,0,0.9);
        }
        h1 {
            color: #ffffff;
            font-size: 32px;
            letter-spacing: 4px;
            margin-bottom: 5px;
            font-weight: 800;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }
        /* СУПЕР-ПУЛЬСАР ЯДРА H.A.L.K. */
        .pulse-orb {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(0,255,102,0.2) 0%, rgba(0,0,0,0) 70%);
            border: 2px solid #00ff66;
            border-radius: 50%;
            margin: 0 auto 40px auto;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 40px rgba(0,255,102,0.2);
            animation: orbBreath 2s ease-in-out infinite;
        }
        .pulse-orb::after {
            content: '';
            position: absolute;
            width: 160px;
            height: 160px;
            border: 1px dashed rgba(0,255,102,0.3);
            border-radius: 50%;
            animation: rotateOuter 12s linear infinite;
        }
        .core-dot {
            width: 12px;
            height: 12px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 20px #00ff66;
        }
        @keyframes orbBreath {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(0,255,102,0.2); }
            50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(0,255,102,0.4); border-color: #ffffff; }
        }
        @keyframes rotateOuter {
            100% { transform: rotate(360deg); }
        }
        .status-panel {
            font-family: monospace;
            font-size: 12px;
            color: #00ff66;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0,255,102,0.3);
        }
    </style>
</head>
<body>

    <div class="ai-station">
        <h1>ALTEREGO™ AI</h1>
        <div class="subtitle">Sovereign Hardware Intelligent Core</div>
        
        <div class="pulse-orb">
            <div class="core-dot"></div>
        </div>
        
        <div class="status-panel">[ H.A.L.K. CORE SECURE CONNECTED - AIR GAP ACTIVE ]</div>
    </div>

</body>
</html>
